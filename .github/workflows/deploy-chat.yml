name: Deploy Chat

on:
  push:
    branches: [main]
    paths:
      - 'Chat/chat.html'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate and inspect Storage without publishing'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-storage.yml
    with:
      app: chat
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    secrets:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_DEPLOY_KEY: ${{ secrets.SUPABASE_DEPLOY_KEY }}
