name: Encrypted Liminal configuration backup

on:
  workflow_dispatch:
  push:
    branches: [codex/liminal-migration-metadata]
    paths:
      - '.github/workflows/migration-metadata-backup.yml'
      - 'scripts/migration_backup*'

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LIMINAL_SOURCE_ACCESS_TOKEN: ${{ secrets.LIMINAL_SOURCE_ACCESS_TOKEN }}
      LIMINAL_BACKUP_PASSPHRASE: ${{ secrets.LIMINAL_BACKUP_PASSPHRASE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test export guards and actual encryption
        run: python3 -m unittest discover -s scripts -p 'migration_backup_test.py' -v
      - name: Export configuration and saved SQL queries
        run: python3 scripts/migration_backup.py --metadata-only --bootstrap-cli --output-dir "$RUNNER_TEMP/liminal-metadata-output"
      - name: Keep encrypted configuration and credential-free summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: liminal-encrypted-configuration-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/liminal-metadata-output/liminal-backup.tar.gz.gpg
            ${{ runner.temp }}/liminal-metadata-output/summary.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove runner output
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/liminal-metadata-output"
