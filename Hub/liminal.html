<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100d17">
<title>Liminal</title>
<style>
  :root {
    color-scheme: dark;
    font-family: "Inter", "Segoe UI", system-ui, sans-serif;
    --ink: #f5f1fb;
    --muted: #a69bb5;
    --settle: cubic-bezier(.2, .75, .25, 1);
    --tap: 100ms;
    --glide: 220ms;
  }

  *, *::before, *::after { box-sizing: border-box; }
  body {
    min-width: 0;
    min-height: 100svh;
    margin: 0;
    color: var(--ink);
    background: radial-gradient(ellipse at 72% 38%, #241635 0%, #171121 37%, #100d17 73%);
  }
  button { color: inherit; font: inherit; cursor: pointer; touch-action: manipulation; }
  button:focus-visible { outline: 2px solid #dfd0ff; outline-offset: 4px; }
  .svg-defs { position: absolute; width: 0; height: 0; overflow: hidden; }
  .icon { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .shell {
    display: grid;
    grid-template-rows: 1fr auto;
    min-height: 100svh;
    max-width: 1536px;
    margin-inline: auto;
    padding: 35px clamp(28px, 5.5vw, 90px) max(27px, env(safe-area-inset-bottom));
  }
  .stage {
    display: grid;
    grid-template-columns: 41% 59%;
    align-items: center;
    min-width: 0;
  }
  .launch { position: relative; z-index: 2; width: min(100%, 365px); margin-top: -42px; }
  .sigil {
    width: 43px;
    height: 43px;
    display: grid;
    place-items: center;
    margin-bottom: 18px;
    border: 1px solid #4b375e;
    border-radius: 13px;
    background: #261b34;
    color: #c8adff;
  }
  .sigil svg { width: 23px; height: 23px; }
  h1 {
    margin: 0 0 35px -0.045em;
    font-size: clamp(70px, 8.1vw, 122px);
    font-weight: 710;
    letter-spacing: -0.075em;
    line-height: .98;
  }
  .actions { display: grid; gap: 10px; }
  .action, .dock button, .dismiss {
    transition: transform var(--glide) var(--settle),
      background-color 140ms ease, border-color 140ms ease, color 140ms ease;
  }
  .action:active, .dock button:active, .dismiss:active {
    transform: scale(.97);
    transition-duration: var(--tap);
  }
  .action {
    display: flex;
    align-items: center;
    gap: 13px;
    border-radius: 14px;
    border: 1px solid #392d47;
    background: #201829;
    font-weight: 600;
    text-align: left;
  }
  .primary {
    height: 70px;
    padding-inline: 21px;
    border-color: #b99cf8;
    background: #b395f5;
    color: #1a1029;
    box-shadow: 0 8px 24px #0b061b4d, inset 0 1px #e2ceff76;
    font-size: 19px;
    font-weight: 720;
    letter-spacing: -.025em;
  }
  .primary .icon { width: 24px; height: 24px; }
  .primary .arrow {
    width: 18px;
    height: 18px;
    margin-left: auto;
    transition: transform var(--glide) var(--settle);
  }
  .primary:focus-visible { background: #c3a8ff; border-color: #d1baff; }
  .secondary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; }
  .secondary .action { justify-content: center; min-width: 0; min-height: 47px; gap: 8px; font-size: 13px; }
  .secondary .icon { width: 17px; height: 17px; color: #bea4e4; }
  .secondary .action:focus-visible { background: #30213e; border-color: #624977; }

  .collage { position: relative; width: 100%; aspect-ratio: 1.2; isolation: isolate; }
  .tile {
    position: absolute;
    display: block;
    padding: 0;
    border: 0;
    border-radius: clamp(8px, 1.1vw, 17px);
    background: transparent;
    color: white;
    transform: rotate(var(--angle));
  }
  /* The artwork lifts inside a stationary hit area. */
  .tile-face {
    position: absolute;
    inset: 0;
    overflow: hidden;
    border: 1px solid #ffffff40;
    border-radius: inherit;
    background: #30213e;
    box-shadow: 0 9px 21px #08041080;
    pointer-events: none;
    transition: transform var(--glide) var(--settle), border-color 140ms ease;
  }
  .tile:focus-visible .tile-face { border-color: #eadbff; }
  .tile:active .tile-face { transform: scale(.98); transition-duration: var(--tap); }
  .tile svg { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
  .tile-label {
    position: absolute;
    inset: auto 0 0;
    display: block;
    padding: 20% 8% 7%;
    background: linear-gradient(transparent, #090619de);
    text-align: left;
    font-size: clamp(10px, 1.27vw, 20px);
    font-weight: 760;
    letter-spacing: -.036em;
    line-height: 1;
  }
  .t1 { left: 3%; top: 10%; width: 35%; height: 33%; --angle: -9deg; z-index: 3; }
  .t2 { left: 35%; top: 1%; width: 36%; height: 31%; --angle: 5deg; z-index: 2; }
  .t3 { left: 68%; top: 12%; width: 29%; height: 34%; --angle: 10deg; z-index: 3; }
  .t4 { left: 0%; top: 43%; width: 32%; height: 36%; --angle: -7deg; z-index: 2; }
  .t5 { left: 27%; top: 34%; width: 48%; height: 40%; --angle: -4deg; z-index: 5; }
  .t6 { left: 69%; top: 46%; width: 28%; height: 37%; --angle: 8deg; z-index: 4; }
  .t7 { left: 28%; top: 72%; width: 42%; height: 23%; --angle: 3deg; z-index: 4; }
  .t5 .tile-label { font-size: clamp(13px, 1.8vw, 29px); padding-bottom: 6%; }

  .footer { display: flex; justify-content: center; padding-top: 14px; }
  .dock {
    display: flex;
    align-items: center;
    gap: clamp(1px, .35vw, 4px);
    max-width: 100%;
    padding: 5px;
    border: 1px solid #392d46;
    border-radius: 16px;
    background: #1c1625;
    box-shadow: 0 6px 18px #08050e62;
  }
  .dock button {
    position: relative;
    display: grid;
    width: clamp(33px, 5vw, 43px);
    height: clamp(36px, 5.2vw, 43px);
    place-items: center;
    padding: 0;
    border: 1px solid transparent;
    border-radius: 10px;
    background: transparent;
    color: var(--muted);
  }
  .dock button:focus-visible { color: var(--ink); background: #302439; }
  .dock button[aria-current="page"] { color: #d5baff; background: #352449; border-color: #52396c; }
  .dock button .icon {
    width: 19px;
    height: 19px;
    transition: transform var(--glide) var(--settle);
  }
  .tip {
    position: absolute;
    z-index: 10;
    bottom: calc(100% + 9px);
    left: 50%;
    transform: translate(-50%, 3px);
    opacity: 0;
    pointer-events: none;
    border: 1px solid #4a385b;
    border-radius: 7px;
    padding: 5px 8px;
    background: #251b30;
    color: var(--ink);
    font-size: 11px;
    line-height: 1.2;
    white-space: nowrap;
    transition: opacity 120ms ease, transform var(--glide) var(--settle);
  }
  .dock button:focus-visible .tip { opacity: 1; transform: translate(-50%, 0); }
  @media (hover: hover) and (pointer: fine) {
    .primary:hover { background: #c3a8ff; border-color: #d1baff; }
    .primary:hover .arrow { transform: translate(2px, -2px); }
    .secondary .action:hover { background: #30213e; border-color: #624977; }
    .tile:hover .tile-face { transform: translateY(-4px); border-color: #ffffff81; }
    .tile:active .tile-face { transform: translateY(-1px) scale(.98); }
    .dock button:hover { color: var(--ink); background: #302439; }
    .dock button:hover .icon { transform: translateY(-2px); }
    .dock button:hover .tip { opacity: 1; transform: translate(-50%, 0); transition-delay: 100ms; }
  }
  dialog {
    width: min(390px, calc(100% - 32px));
    padding: 25px;
    border: 1px solid #503b63;
    border-radius: 18px;
    background: #21182b;
    color: var(--ink);
    box-shadow: 0 20px 70px #08050fb3;
  }
  dialog {
    opacity: 0;
    transform: translateY(8px) scale(.985);
    transition: opacity 150ms ease, transform var(--glide) var(--settle);
    transition: opacity 150ms ease, transform var(--glide) var(--settle),
      display var(--glide) allow-discrete, overlay var(--glide) allow-discrete;
  }
  dialog[open] { opacity: 1; transform: none; }
  dialog::backdrop {
    background: #0b0815b8;
    opacity: 0;
    transition: opacity 170ms ease, display var(--glide) allow-discrete,
      overlay var(--glide) allow-discrete;
  }
  dialog[open]::backdrop { opacity: 1; }
  @starting-style {
    dialog[open] { opacity: 0; transform: translateY(8px) scale(.985); }
    dialog[open]::backdrop { opacity: 0; }
  }
  dialog h2 { margin: 0; padding-right: 36px; font-size: 29px; letter-spacing: -.04em; }
  dialog p { margin: 9px 0 0; color: #c1b4cc; line-height: 1.55; font-size: 14px; }
  .dismiss {
    position: absolute;
    top: 15px;
    right: 15px;
    display: grid;
    place-items: center;
    width: 34px;
    height: 34px;
    padding: 0;
    border: 1px solid #473654;
    border-radius: 8px;
    background: #30243c;
  }
  .dismiss:hover { background: #473454; }
  @media (max-width: 960px) and (min-width: 701px) {
    .launch { width: 89%; }
    h1 { font-size: clamp(61px, 9vw, 88px); }
    .secondary .action { gap: 4px; }
    .secondary .icon { width: 14px; height: 14px; }
  }
  @media (max-width: 700px) {
    .shell {
      padding: 33px clamp(16px, 6vw, 38px) max(18px, env(safe-area-inset-bottom));
    }
    .stage { grid-template-columns: minmax(0, 1fr); align-content: center; gap: 26px; }
    .launch { margin: 0; width: min(100%, 365px); }
    .sigil { width: 33px; height: 33px; margin-bottom: 12px; border-radius: 10px; }
    .sigil svg { width: 18px; height: 18px; }
    h1 { font-size: clamp(59px, 13vw, 83px); margin-bottom: 21px; }
    .primary { height: 55px; font-size: 16px; }
    .secondary .action { min-height: 44px; }
    .dock button { height: 42px; }
    .collage { width: min(100%, 470px); margin-inline: auto; aspect-ratio: 1.38; }
    .tile-label { font-size: clamp(10px, 2.8vw, 15px); }
    .t5 .tile-label { font-size: clamp(12px, 3.7vw, 20px); }
    .footer { padding-top: 20px; }
  }
  @media (max-width: 360px) {
    .secondary .action { gap: 5px; }
    .dock button { min-width: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after, dialog::backdrop { transition: none !important; }
    .action:active, .dismiss:active,
    .tile:is(:hover, :active) .tile-face,
    .primary:hover .arrow, .dock button:hover .icon, .dock button:active {
      transform: none;
    }
  }
  [hidden] { display: none !important; }
  .account-entry {
    position: absolute; top: 21px; right: clamp(16px, 5.5vw, 90px); z-index: 7;
    display: flex; gap: 8px; align-items: center; min-height: 40px;
    padding: 0 12px; border: 1px solid #49385a; border-radius: 11px; background: #251b30;
  }
  .account-entry:hover, .hub-button:hover { background: #382649; }
  .account-entry .icon, .hub-button .icon { width: 17px; height: 17px; }
  .shell[data-workspace] { height: 100dvh; min-height: 0; padding: 12px 14px max(8px, env(safe-area-inset-bottom)); }
  .shell[data-workspace] .footer { padding-top: 8px; }
  .workspace {
    display: grid; grid-template-rows: auto minmax(0, 1fr);
    min-height: 0; overflow: hidden; border: 1px solid #392d46; border-radius: 15px; background: #171120;
  }
  .workspace-bar {
    display: flex; align-items: center; gap: 8px; min-width: 0;
    padding: 7px 10px; border-bottom: 1px solid #392d46; background: #20172a;
  }
  .workspace-bar h2 { margin: 0 auto 0 4px; font-size: 15px; font-weight: 650; }
  .workspace-content { position: relative; min-height: 0; }
  .workspace-content iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #171120; }
  .launch-state { display: grid; place-content: center; height: 100%; padding: 20px; text-align: center; }
  .launch-state p { color: #c4b4d4; max-width: 38ch; }
  .launch-state div, .account-actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .hub-button {
    padding: 8px 12px; border: 1px solid #523e65; border-radius: 9px;
    background: #2d203a; font-size: 13px; min-height: 36px;
  }
  .hub-button:disabled { opacity: .55; cursor: wait; }
  .hub-button.accent { background: #b395f5; border-color: #c5adfc; color: #1a1029; font-weight: 700; }
  .hub-button.accent:hover { background: #cebaff; }
  .hub-form { display: grid; gap: 11px; margin-top: 17px; }
  .hub-form label { display: grid; gap: 4px; font-size: 13px; color: #c9bdd8; }
  .hub-input {
    width: 100%; min-width: 0; padding: 9px 11px; border: 1px solid #523e65;
    border-radius: 9px; background: #171120; color: var(--ink); font: inherit;
  }
  .account-actions { justify-content: flex-start; margin-top: 16px; }
  .drive { height: 100%; overflow: auto; padding: clamp(12px, 3vw, 34px); }
  .drive-inner { max-width: 980px; margin-inline: auto; }
  .drive-header { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; }
  .drive-actions, .drive-row-actions, .drive-path { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .drive-path { margin: 0 0 10px; overflow-wrap: anywhere; }
  .drive-path button { color: #dcc6fc; border: 0; background: transparent; padding: 7px; }
  .drive-path button:hover { text-decoration: underline; }
  .drive-list { list-style: none; margin: 12px 0; padding: 0; border-top: 1px solid #3a2b47; }
  .drive-list li { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 9px; min-height: 49px; border-bottom: 1px solid #3a2b47; padding: 7px 0; }
  .drive-name { display: flex; align-items: center; gap: 8px; overflow-wrap: anywhere; text-align: left; max-width: 100%; }
  button.drive-name { border: 0; background: transparent; padding: 5px 2px; color: #ddc8fc; }
  button.drive-name:hover { text-decoration: underline; }
  #drive-status, #account-status { color: #c4b4d4; font-size: 13px; overflow-wrap: anywhere; }
  #drive-status { min-height: 1.4em; }
  @media (max-width: 700px) {
    .account-entry { top: 12px; }
    .shell:not([data-workspace]) { padding-top: 65px; }
    .shell[data-workspace] { padding-inline: 5px; }
  }
</style>
</head>
<body>
<!-- Icon symbols are reused by both sets of controls. -->
<svg class="svg-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <symbol id="logo" viewBox="0 0 24 24">
    <path fill="currentColor" d="M3 18.8 11.9 3h4L7 18.8zM10 18.8l5.1-9h4l-5 9zM17 18.8l2.1-3.7h3.8l-2.1 3.7z"/>
  </symbol>
  <symbol id="home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="games" viewBox="0 0 24 24"><path d="M7.5 7h9a4 4 0 0 1 3.9 3.1l1.1 4.8a2.6 2.6 0 0 1-4.4 2.3l-2-2.2H9l-2 2.2a2.6 2.6 0 0 1-4.4-2.3l1.1-4.8A4 4 0 0 1 7.5 7zM6.5 11h4m-2-2v4m7.5-2h.1m2.9 2h.1"/></symbol>
  <symbol id="chat" viewBox="0 0 24 24"><path d="M20.5 11.5a8.5 8.5 0 0 1-8.5 8.5 9 9 0 0 1-3.4-.7L4 20l.8-4.3a8.5 8.5 0 1 1 15.7-4.2zM8 12h.1m3.9 0h.1m3.9 0h.1"/></symbol>
  <symbol id="drive" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="player" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="12.5" rx="2.5"/><path d="M8 21h8m-6-12 5 2-5 2.5z"/></symbol>
  <symbol id="music" viewBox="0 0 24 24"><path d="M9 17V6l10-2v11M9 9l10-2"/><ellipse cx="6.5" cy="17.5" rx="2.5" ry="2"/><ellipse cx="16.5" cy="15.5" rx="2.5" ry="2"/></symbol>
  <symbol id="movies" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18m-15-5 3 5m2-5 3 5m2-5 3 5"/></symbol>
  <symbol id="apps" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1.4"/><rect x="14" y="4" width="6" height="6" rx="1.4"/><rect x="4" y="14" width="6" height="6" rx="1.4"/><rect x="14" y="14" width="6" height="6" rx="1.4"/></symbol>
  <symbol id="arrow" viewBox="0 0 24 24"><path d="M6 18 18 6M8 6h10v10"/></symbol>
  <symbol id="account-icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20v-2a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v2"/></symbol>
  <symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
</svg>

<button id="home-account" class="account-entry" type="button" data-service="Account">
  <svg class="icon" aria-hidden="true"><use href="#account-icon"/></svg><span id="home-account-label">Account</span>
</button>
<div class="shell">
  <main class="stage">
    <section class="launch" aria-labelledby="wordmark">
      <span class="sigil" aria-hidden="true"><svg><use href="#logo"/></svg></span>
      <h1 id="wordmark">Liminal</h1>
      <nav class="actions" aria-label="Featured services">
        <button class="action primary" type="button" data-service="Games">
          <svg class="icon" aria-hidden="true"><use href="#games"/></svg>
          Games
          <svg class="icon arrow" aria-hidden="true"><use href="#arrow"/></svg>
        </button>
        <div class="secondary">
          <button class="action" type="button" data-service="Chat"><svg class="icon" aria-hidden="true"><use href="#chat"/></svg>Chat</button>
          <button class="action" type="button" data-service="Movies"><svg class="icon" aria-hidden="true"><use href="#movies"/></svg>Movies</button>
          <button class="action" type="button" data-service="Apps"><svg class="icon" aria-hidden="true"><use href="#apps"/></svg>Apps</button>
        </div>
      </nav>
    </section>

    <section class="collage" aria-label="Sample games">
      <button class="tile t1" type="button" data-game="Moonwake">
        <span class="tile-face">
          <svg viewBox="0 0 320 230" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
            <defs><linearGradient id="moon-sky" x2="0" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#392e77"/><stop offset="1" stop-color="#ad70aa"/></linearGradient></defs>
            <path fill="url(#moon-sky)" d="M0 0h320v230H0z"/>
            <circle cx="217" cy="73" r="46" fill="#f2bca5"/>
            <circle cx="236" cy="62" r="42" fill="#72558f"/>
            <path fill="#7e5d99" d="M0 150 62 96l22 24 33-19 48 38 40-23 38 24 37-29 40 28v91H0z"/>
            <path fill="#4a3c75" d="M0 169l49-21 27 10 44-21 63 27 33-18 51 16 53-10v78H0z"/>
            <path fill="#292447" d="M0 169c32-16 63-10 85 10l21 13 31 5-20 33H0zm320-9c-36-9-58 3-76 19l-54 51h130z"/>
            <path fill="none" stroke="#e6a9ba" stroke-width="2" opacity=".65" d="M166 168h33m-47 8h51m-68 10h50m-32 11h42"/>
            <path fill="#f6d4cb" d="M39 50h2v2h-2zm51 26h2v2h-2zm47-44h3v3h-3zm138 32h2v2h-2z"/>
          </svg>
          <span class="tile-label">Moonwake</span>
        </span>
      </button>

      <button class="tile t2" type="button" data-game="Orbit Breaker">
        <span class="tile-face">
          <svg viewBox="0 0 320 215" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
            <defs><linearGradient id="orbit-sky" x2="1" y2="1"><stop stop-color="#153957"/><stop offset="1" stop-color="#355b8c"/></linearGradient></defs>
            <path fill="url(#orbit-sky)" d="M0 0h320v215H0z"/>
            <circle cx="208" cy="87" r="62" fill="#66b2cb"/>
            <path fill="#417ea6" d="M151 67a62 62 0 0 0 110 49c-34 17-85 11-110-49z"/>
            <ellipse cx="207" cy="89" rx="109" ry="22" transform="rotate(-23 207 89)" fill="none" stroke="#b4e6df" stroke-width="5"/>
            <path fill="#e0fcff" d="M43 37h3v3h-3zm42 55h3v3h-3zm185-62h3v3h-3zm23 80h3v3h-3zm-163 13h2v2h-2z"/>
            <path fill="#1a3456" d="m29 188 52-32 19 10 16-6 23 19-43 20z"/>
            <path fill="#f4cf87" d="m59 177 36-30 12 8 23-4-16 21-38 12 8-13z"/>
            <path fill="#edf1ed" d="m95 147 35 4-24 8z"/>
          </svg>
          <span class="tile-label">Orbit Breaker</span>
        </span>
      </button>

      <button class="tile t3" type="button" data-game="Sun Circuit">
        <span class="tile-face">
          <svg viewBox="0 0 265 235" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
            <path fill="#b65663" d="M0 0h265v235H0z"/>
            <circle cx="143" cy="84" r="57" fill="#ffc47f"/>
            <path fill="#e8866c" d="M0 91h265v4H0zm0 12h265v5H0zm0 14h265v6H0z" opacity=".67"/>
            <path fill="#703b63" d="m0 136 32-28 34 18 28-19 43 35 31-24 21 12 46-24 30 20v109H0z"/>
            <path fill="#423057" d="M0 163c78-21 162-25 265-7v79H0z"/>

<script>
const byId = id => document.getElementById(id);
const project = 'https://trsirhyucncmyyfyiuje.supabase.co';
const publicKey = 'sb_publishable_IRSgHfkgRkLvRYcoKkwAqA_UFpMAetG';
const storageRoot = project + '/storage/v1/object/public/liminal-apps/';
const sessionKey = 'sb-trsirhyucncmyyfyiuje-auth-token';
const localMode = ['localhost', '127.0.0.1', '[::1]'].includes(location.hostname)
  && new URLSearchParams(location.search).get('source') === 'local';
const protocol = 6;
const localFile = location.protocol === 'file:';
const apps = {
  Games: { file: 'games.html', marker: 'liminal:games:ready', kind: 'games' },
  Chat: { file: 'chat.html', marker: 'liminal:chat:ready', kind: 'chat' },
  Admin: { file: 'liminal-admin.html', marker: 'liminal:admin:ready', kind: 'admin' },
};
const accountDialog = byId('account-dialog');
const mediaDialog = byId('media-dialog');
const destination = byId('destination');
const workspace = byId('workspace');
const home = document.querySelector('.stage');
const shell = document.querySelector('.shell');
const dock = [...document.querySelectorAll('.dock button')];
let active = 'Home';
let lastHomeControl = null;
let authPromise;
let accountId;
let mediaRequest;
let devSession = location.hash === '#chat' && window.name.startsWith('liminal-devsession:')
  ? window.name : '';
const devMode = location.hash === '#chat' && (Boolean(devSession) || (() => {
  try { return sessionStorage.getItem('lc_dev_session') === '1'; }
  catch { return false; }
})());
if (devSession) window.name = '';

function status(message, retry = false, show = false) {
  byId('launch-state').hidden = !message;
  byId('launch-status').textContent = message;
  byId('launch-retry').hidden = !retry;
  byId('launch-show').hidden = !show;
}

function dispose(app) {
  app.controller?.abort();
  clearTimeout(app.timer);
  clearTimeout(app.idleTimer);
  app.frame?.remove();
  app.controller = app.frame = null;
  app.phase = '';
}

function isLocalAppFrame(app) {
  // A file URL is not a valid exact postMessage target. Limit wildcard
  // delivery to the hub's own srcdoc, not a frame that navigated away.
  return app.frame?.contentDocument?.URL === 'about:srcdoc';
}

function frameMessage(app, data) {
  if (localFile && !isLocalAppFrame(app)) return;
  app.frame?.contentWindow?.postMessage(data, localFile ? '*' : location.origin);
}

function acceptsFrameOrigin(app, origin) {
  if (!localFile) return origin === location.origin;
  return (origin === 'null' || origin === 'file://') && isLocalAppFrame(app);
}

function reveal(app) {
  clearTimeout(app.timer);
  app.phase = 'ready';
  if (apps[active] === app) {
    app.frame.hidden = false;
    status('');
  }
}

async function decode(id) {
  const node = byId(id);
  const bytes = Uint8Array.from(atob(node.textContent.trim()), char => char.charCodeAt(0));
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  return new Response(stream).text();
}

async function getAuth() {
  if (!authPromise) {
    authPromise = (async () => {
      if (!window.supabase) {
        const url = URL.createObjectURL(new Blob([await decode('account-library')], { type: 'text/javascript' }));
        const script = document.createElement('script');
        try {
          await new Promise((resolve, reject) => {
            script.onload = resolve;
            script.onerror = () => reject(new Error('Could not start Liminal Accounts.'));
            script.src = url;
            document.head.append(script);
          });
        } finally {
          script.remove();
          URL.revokeObjectURL(url);
        }
      }
      const client = window.supabase.createClient(project, publicKey, {
        auth: { detectSessionInUrl: false, storageKey: sessionKey },
      });
      window.liminalHubAuth = client;
      client.auth.onAuthStateChange((_event, session) => updateAccount(session));
      return client;
    })().catch(error => { authPromise = null; throw error; });
  }
  return authPromise;
}

function updateAccount(session) {
  const nextId = session?.user?.id || null;
  if (accountId && accountId !== nextId) {
    closeMedia(false);
    dispose(apps.Chat);
    dispose(apps.Admin);
    resetDrive();
    if (active === 'Admin' || active === 'Drive' || active === 'Chat') showWorkspace('Home');
  }
  accountId = nextId;
  const username = session?.user?.email?.split('@')[0];
  const label = username ? '@' + username : 'Account';
  byId('home-account-label').textContent = label;
  byId('workspace-account').textContent = label;
}

async function sessionFor(client) {
  const { data, error } = await client.auth.getSession();
  if (error) throw error;
  updateAccount(data.session);
  return data.session;
}

async function readProfile(client) {
  const { data, error } = await client.rpc('chat_get_my_profile');
  if (error) throw error;
  return data;
}

async function showAccount(message = '') {
  const form = byId('account-form');
  const actions = byId('account-actions');
  const note = byId('account-status');
  form.hidden = actions.hidden = true;
  note.textContent = 'Checking your account…';
  if (!accountDialog.open) accountDialog.showModal();
  try {
    const client = await getAuth();
    const session = await sessionFor(client);
    if (!accountDialog.open) return;
    form.hidden = Boolean(session);
    actions.hidden = !session;
    byId('account-admin').hidden = true;
    note.textContent = message || (session ? 'Signed in as @' + session.user.email.split('@')[0] : 'Sign in with your Liminal username.');
    if (session) {
      const profile = await readProfile(client);
      if (accountDialog.open && accountId === session.user.id) {
        byId('account-admin').hidden = !(profile?.is_admin || profile?.is_owner) || Boolean(profile?.is_banned);
      }
    }
  } catch (error) {
    if (accountDialog.open) note.textContent = error.message || 'Could not check your account.';
  }
}

byId('account-form').addEventListener('submit', async event => {
  event.preventDefault();
  const button = byId('account-signin');
  const password = byId('account-password');
  const username = byId('account-user').value.trim().replace(/^@/, '').toLowerCase();
  if (button.disabled) return;
  button.disabled = true;
  byId('account-status').textContent = 'Signing in…';
  try {
    const client = await getAuth();
    const { error } = await client.auth.signInWithPassword({
      email: username + '@accounts.liminal.invalid', password: password.value,
    });
    if (error) throw error;
    password.value = '';
    if (accountDialog.open) await showAccount();
    if (active === 'Drive') void openDrive();
  } catch (error) {
    byId('account-status').textContent = error.message || 'Could not sign in.';
  } finally { button.disabled = false; }
});
accountDialog.addEventListener('close', () => { byId('account-password').value = ''; });
byId('account-signout').addEventListener('click', async event => {
  const button = event.currentTarget;
  button.disabled = true;
  try {
    const client = await getAuth();
    await apps.Admin.frame?.contentWindow?.liminalRevokeControl?.();
    const { error } = await client.auth.signOut({ scope: 'local' });
    if (error) throw error;
    if (accountDialog.open) await showAccount();
  } catch (error) {
    byId('account-status').textContent = error.message || 'Could not sign out.';
  } finally { button.disabled = false; }
});

async function getAppDocument(app, signal, refresh) {
  if (app.kind === 'admin') return decode('admin-document');
  const url = new URL(app.file, localMode ? new URL('.', location.href) : storageRoot);
  url.searchParams.set('launcher', String(protocol));
  if (refresh) url.searchParams.set('refresh', refresh);
  const response = await fetch(url, { signal, cache: refresh ? 'reload' : 'no-cache', redirect: 'error' });
  if (!response.ok) throw new Error('Could not load ' + app.kind + ' (HTTP ' + response.status + ').');
  const html = await response.text();
  if (!/<html[\s>]/i.test(html) || !html.includes(app.marker) || !html.includes(project)) {
    throw new Error('The published ' + app.kind + ' file is not compatible with this launcher.');
  }
  return html;
}

async function launch(name, refresh = '') {
  const app = apps[name];
  dispose(app);
  const controller = new AbortController();
  app.controller = controller;
  app.phase = 'loading';
  status('Opening ' + name + '…');
  const timeout = setTimeout(() => controller.abort(), 20000);
  try {
    if (name === 'Admin') {
      const client = await getAuth();
      if (!await sessionFor(client)) throw new Error('Sign in to open Admin.');
      const profile = await readProfile(client);
      if (!(profile?.is_admin || profile?.is_owner) || profile.is_banned) {
        throw new Error('This account does not have administrator access.');
      }
    }
    const html = await getAppDocument(app, controller.signal, refresh);
    if (app.controller !== controller || active !== name) return;
    if (controller.signal.aborted) throw new Error('Opening ' + name + ' timed out.');
    const frame = document.createElement('iframe');
    frame.title = 'Liminal ' + name;
    frame.hidden = true;
    if (name === 'Chat') {
      frame.allow = 'camera *; microphone *; display-capture *; autoplay *; fullscreen *';
      const chatUrl = new URL(location.href);
      chatUrl.hash = 'chat';
      frame.name = devSession || 'liminal-launcher:' + chatUrl.href;
      devSession = '';
    }
    if (name === 'Games') frame.allow = 'fullscreen *; autoplay *';
    app.frame = frame;
    app.phase = 'starting';
    frame.srcdoc = html;
    byId('workspace-content').append(frame);
    app.timer = setTimeout(() => {
      if (active !== name || app.phase !== 'starting') return;
      app.phase = 'error';
      status(name + ' loaded but did not report ready.', true, true);
    }, 25000);
  } catch (error) {
    if (app.controller !== controller || active !== name) return;
    app.phase = 'error';
    status(controller.signal.aborted ? 'Opening ' + name + ' timed out.' : error.message, true);
  } finally {
    clearTimeout(timeout);
    if (app.controller === controller) app.controller = null;
  }
}

function showWorkspace(name) {
  if (devMode && name !== 'Chat') return;
  const previous = active;
  if (previous === name && name !== 'Home') return;
  const oldApp = apps[previous];
  if (oldApp) {
    if (oldApp.phase === 'ready') {
      oldApp.frame.hidden = true;
      if (previous === 'Games') oldApp.idleTimer = setTimeout(() => dispose(oldApp), 60000);
    } else dispose(oldApp);
  }
  if (previous === 'Chat') closeMedia(false);
  if (previous === 'Admin' && oldApp.frame) frameMessage(oldApp, { type: 'liminal:hub:active', active: false });
  if (previous === 'Drive') byId('drive-panel').hidden = true;
  active = name;
  for (const button of dock) {
    if (button.dataset.service === name) button.setAttribute('aria-current', 'page');
    else button.removeAttribute('aria-current');
  }
  status('');
  const showingHome = name === 'Home';
  home.hidden = !showingHome;
  workspace.hidden = showingHome;
  byId('home-account').hidden = !showingHome;
  shell.toggleAttribute('data-workspace', !showingHome);
  if (showingHome) {
    lastHomeControl?.focus();
    return;
  }
  const heading = byId('workspace-title');
  heading.textContent = name;
  heading.focus();
  if (name === 'Drive') {
    byId('drive-panel').hidden = false;
    void openDrive();
  } else if (apps[name].phase === 'ready') {
    clearTimeout(apps[name].idleTimer);
    apps[name].frame.hidden = false;
    if (name === 'Admin') frameMessage(apps[name], { type: 'liminal:hub:active', active: true });
  } else {
    void launch(name);
  }
}

function closeMedia(ok, extra = {}) {
  const request = mediaRequest;
  mediaRequest = null;
  if (mediaDialog.open) mediaDialog.close();
  if (!request || apps.Chat.frame !== request.frame) return;
  frameMessage(apps.Chat, { type: 'liminal:voice:media-result', requestId: request.id, ok, ...extra });
}

window.addEventListener('message', event => {
  const app = Object.values(apps).find(item => item.frame?.contentWindow === event.source);
  if (!app || !acceptsFrameOrigin(app, event.origin) || !event.data || typeof event.data !== 'object') return;
  const { type } = event.data;
  if (type === 'liminal:' + app.kind + ':hello' && app.kind !== 'admin') {
    if (app.kind === 'chat' && !app.frame.name && !devSession) {
      const chatUrl = new URL(location.href);
      chatUrl.hash = 'chat';
      app.frame.name = 'liminal-launcher:' + chatUrl.href;
    }
    frameMessage(app, { type: 'liminal:launcher:hello', version: protocol });
  } else if (type === app.marker && ['starting', 'error'].includes(app.phase)) {
    reveal(app);
  } else if (app.kind === 'chat' && type === 'liminal:chat:force-refresh') {
    const token = String(event.data.requestedAt || '').slice(0, 128);
    if (active === 'Chat' && token && app.refresh !== token) {
      app.refresh = token;
      frameMessage(app, { type: 'liminal:launcher:refreshing', requestedAt: event.data.requestedAt });
      void launch('Chat', token);
    }
  } else if (app.kind === 'chat' && type === 'liminal:voice:request-media' && typeof event.data.requestId === 'string') {
    const requestId = event.data.requestId;
    frameMessage(app, { type: 'liminal:voice:media-pending', requestId });
    if (active !== 'Chat') {
      frameMessage(app, { type: 'liminal:voice:media-result', requestId, ok: false, name: 'NotAllowedError' });
      return;
    }
    if (mediaRequest) closeMedia(false, { name: 'NotAllowedError' });
    mediaRequest = { id: requestId, frame: app.frame, audio: Boolean(event.data.audio), video: Boolean(event.data.video) };
    byId('media-status').textContent = mediaRequest.video ? 'Allow Chat to request your camera.' : 'Allow Chat to request your microphone.';
    mediaDialog.showModal();
  } else if (app.kind === 'chat' && type === 'liminal:voice:media-cancel') {
    closeMedia(false);
  }
});

byId('media-allow').addEventListener('click', async event => {
  const request = mediaRequest;
  if (!request) return;
  const button = event.currentTarget;
  button.disabled = true;
  try {
    if (!navigator.mediaDevices?.getUserMedia) throw new Error('This browser cannot request media here.');
    const stream = await navigator.mediaDevices.getUserMedia({ audio: request.audio, video: request.video });
    for (const track of stream.getTracks()) track.stop();
    if (request === mediaRequest) closeMedia(true);
  } catch (error) {
    if (request === mediaRequest) closeMedia(false, { name: error.name, message: error.message });
  } finally { button.disabled = false; }
});
byId('media-deny').addEventListener('click', () => closeMedia(false, { name: 'NotAllowedError' }));
mediaDialog.addEventListener('cancel', event => {
  event.preventDefault();
  closeMedia(false, { name: 'NotAllowedError' });
});
byId('launch-retry').addEventListener('click', () => void launch(active));
byId('launch-show').addEventListener('click', () => reveal(apps[active]));

document.addEventListener('click', event => {
  const control = event.target.closest('[data-service], [data-game]');
  if (!control) return;
  const { service, game } = control.dataset;
  if (devMode && service !== 'Chat') return;
  if (service === 'Account') {
    void showAccount();
    return;
  }
  if (service === 'Home' || service === 'Drive' || apps[service]) {
    if (accountDialog.open) accountDialog.close();
    if (active === 'Home' && service !== 'Home') lastHomeControl = control.closest('dialog') ? byId('home-account') : control;
    showWorkspace(service);
    return;
  }
  byId('destination-title').textContent = game || service;
  byId('destination-description').textContent = game
    ? 'Sample artwork. Open Games to browse the catalog.'
    : service + ' is coming to the hub.';
  if (!destination.open) destination.showModal();
});
destination.addEventListener('click', event => {
  if (event.target !== destination) return;
  const bounds = destination.getBoundingClientRect();
  if (event.clientX < bounds.left || event.clientX > bounds.right ||
      event.clientY < bounds.top || event.clientY > bounds.bottom) destination.close();
});

// Loading the homepage does not initialize Auth. A shared session already on this
// origin is restored when Accounts, Drive, or Admin is first used.
if (devMode) {
  document.querySelector('.footer').hidden = true;
  byId('workspace-account').hidden = true;
  workspace.querySelector('[data-service="Home"]').hidden = true;
}
if (location.hash === '#chat') showWorkspace('Chat');

const driveBucket = 'liminal-drive';
const pageSize = 50;
const maxFileBytes = 50 * 1024 * 1024;
let drive = newDrive();

function newDrive() {
  return { client: null, rank: 0, prefix: '', rows: [], more: false, generation: 0, busy: false };
}
function resetDrive() {
  drive = newDrive();
  renderDrive();
}
function driveStatus(message) { byId('drive-status').textContent = message; }
function bucket(state = drive) { return state.client.storage.from(driveBucket); }

function driveRank(profile) {
  if (!profile || profile.is_banned) return 0;
  if (profile.is_owner || profile.is_admin ||
      ['admin', 'super_mega_tuff_admin', 'dusty', 'co_owner', 'owner', 'preston'].includes(profile.staff_role)) return 3;
  if (['mod', 'manager'].includes(profile.staff_role)) return 2;
  return 1;
}

async function openDrive() {
  const state = drive;
  driveStatus('Checking Drive access…');
  try {
    const client = await getAuth();
    const session = await sessionFor(client);
    const rank = session ? driveRank(await readProfile(client)) : 0;
    if (state !== drive || active !== 'Drive') return;
    state.client = rank ? client : null;
    state.rank = rank;
    if (state.prefix === '.trash' && rank < 3) state.prefix = '';
    renderDrive();
    if (!session) driveStatus('Sign in with your Liminal account to open Drive.');
    else if (!rank) driveStatus('This account does not have Drive access.');
    else await listDrive();
  } catch (error) {
    if (state === drive && active === 'Drive') driveStatus(error.message || 'Could not open Drive.');
  }
}

function drivePath(prefix, name) { return prefix ? prefix + '/' + name : name; }
function driveButton(text, handler, className = 'hub-button') {
  const button = document.createElement('button');
  button.type = 'button';
  button.className = className;
  button.textContent = text;
  button.addEventListener('click', handler);
  return button;
}

function renderDrive() {
  const { prefix, rank, rows, more, busy } = drive;
  const inTrash = prefix === '.trash';
  byId('drive-upload').hidden = rank < 2 || inTrash;
  byId('drive-folder').hidden = rank < 2 || inTrash;
  byId('drive-trash').hidden = rank < 3 || inTrash;
  for (const id of ['drive-upload', 'drive-folder', 'drive-trash', 'drive-refresh', 'drive-more']) {
    byId(id).disabled = busy;
  }
  byId('drive-more').hidden = !more;
  const path = byId('drive-path');
  const root = driveButton('Drive', () => void goFolder(''), 'drive-crumb');
  root.disabled = busy;
  path.replaceChildren(root);
  if (prefix) {
    let ancestor = '';
    for (const part of prefix.split('/')) {
      ancestor = drivePath(ancestor, part);
      const target = ancestor;
      const crumb = driveButton(part === '.trash' ? 'Trash' : part, () => void goFolder(target), 'drive-crumb');
      crumb.disabled = busy;
      path.append(' / ', crumb);
    }
  }

  const fragment = document.createDocumentFragment();
  for (const object of rows) {
    if (object.name === '.trash') continue;
    const row = document.createElement('li');
    const key = drivePath(prefix, object.name);
    if (!object.id && !inTrash) {
      const folder = driveButton('▱  ' + object.name, () => void goFolder(key), 'drive-name');
      folder.disabled = busy;
      row.append(folder);
    } else {
      const original = inTrash ? untrashName(object.name) : null;
      const label = document.createElement('span');
      label.className = 'drive-name';
      label.textContent = original || object.name;
      const actions = document.createElement('div');
      actions.className = 'drive-row-actions';
      if (!inTrash) actions.append(driveButton('Download', () => void downloadDrive(key)));
      if (rank >= 3 && !inTrash) {
        actions.append(
          driveButton('Rename', () => void renameDrive(key, object.name)),
          driveButton('Move to trash', () => void trashDrive(key)),
        );
      } else if (rank >= 3 && original) {
        actions.append(driveButton('Restore', () => void changeDrive(() => bucket().move(key, original), 'Restored.')));
      }
      for (const button of actions.children) button.disabled = busy;
      row.append(label, actions);
    }
    fragment.append(row);
  }
  byId('drive-list').replaceChildren(fragment);
}

async function listDrive(append = false, keepStatus = false) {
  const state = drive;
  if (!state.client || state.busy) return;
  const offset = append ? state.rows.length : 0;
  const signature = JSON.stringify([state.prefix, offset]);
  if (state.listing === signature && !keepStatus) return;
  state.listing = signature;
  const generation = ++state.generation;
  byId('drive-more').disabled = true;
  if (!append) {
    state.rows = [];
    state.more = false;
    renderDrive();
  }
  if (!keepStatus) driveStatus('Loading files…');
  try {
    const { data, error } = await bucket(state).list(state.prefix, {
      limit: pageSize + 1, offset, sortBy: { column: 'name', order: 'asc' },
    });
    if (state !== drive || generation !== state.generation) return;
    if (error) throw error;
    state.rows.push(...data.slice(0, pageSize));
    state.more = data.length > pageSize;
    renderDrive();
    if (!keepStatus) driveStatus(state.rows.some(row => row.name !== '.trash') ? '' : 'This folder is empty.');
  } catch (error) {
    if (state === drive && generation === state.generation) driveStatus(error.message || 'Could not load files.');
  } finally {
    if (state === drive && generation === state.generation) {
      state.listing = null;
      byId('drive-more').disabled = state.busy;
    }
  }
}

async function goFolder(prefix) {
  if (drive.busy) return;
  drive.prefix = prefix;
  await listDrive();
}

function cleanName(name) {
  const cleaned = name.trim();
  if (!cleaned || cleaned === '.' || cleaned === '..' || cleaned === '.trash' || /[/\\\u0000-\u001f]/u.test(cleaned)) {
    throw new Error('Use a name without slashes or reserved characters.');
  }
  return cleaned;
}
function trashName(key) {
  const encoded = btoa(String.fromCharCode(...new TextEncoder().encode(key)))
    .replaceAll('+', '-').replaceAll('/', '_').replace(/=+$/, '');
  return crypto.randomUUID() + '.' + encoded;
}
function untrashName(name) {
  const encoded = name.split('.')[1];
  if (!encoded) return null;
  try {
    return new TextDecoder('utf-8', { fatal: true }).decode(
      Uint8Array.from(atob(encoded.replaceAll('-', '+').replaceAll('_', '/')), char => char.charCodeAt(0)),
    );
  } catch { return null; }
}

async function downloadDrive(key) {
  const state = drive;
  try {
    const { data, error } = await bucket(state).createSignedUrl(key, 60, { download: true });
    if (error) throw error;
    if (state !== drive || active !== 'Drive') return;
    const link = document.createElement('a');
    link.href = data.signedUrl;
    link.rel = 'noreferrer';
    link.download = key.split('/').pop();
    document.body.append(link);
    link.click();
    link.remove();
  } catch (error) { if (state === drive) driveStatus(error.message || 'Could not download this file.'); }
}

async function changeDrive(action, success) {
  const state = drive;
  if (state.busy || state.rank < 3) return;
  state.busy = true;
  renderDrive();
  try {
    const { error } = await action();
    if (error) throw error;
    if (state === drive) driveStatus(success);
  } catch (error) { if (state === drive) driveStatus(error.message || 'Could not change this file.'); }
  finally {
    state.busy = false;
    if (state === drive) await listDrive(false, true);
  }
}

function renameDrive(key, name) {
  const value = prompt('Rename file', name);
  if (value === null) return;
  try {
    const next = drivePath(drive.prefix, cleanName(value));
    if (new TextEncoder().encode(next).length > 600) throw new Error('The file path is too long.');
    if (key !== next) void changeDrive(() => bucket().move(key, next), 'Renamed.');
  } catch (error) { driveStatus(error.message); }
}
function trashDrive(key) {
  if (!confirm('Move this file to Trash? An administrator can restore it.')) return;
  void changeDrive(() => bucket().move(key, '.trash/' + trashName(key)), 'Moved to Trash.');
}

byId('drive-upload').addEventListener('click', () => byId('drive-files').click());
byId('drive-files').addEventListener('change', async event => {
  const files = [...event.target.files];
  const state = drive;
  event.target.value = '';
  if (!files.length || state.busy || state.rank < 2 || state.prefix === '.trash') return;
  state.busy = true;
  renderDrive();
  const storage = bucket(state);
  const folder = state.prefix;
  const failures = [];
  let uploaded = 0;
  try {
    for (const [index, file] of files.entries()) {
      if (state !== drive) return;
      driveStatus('Uploading ' + (index + 1) + ' of ' + files.length + '…');
      try {
        if (file.size > maxFileBytes) throw new Error('Over the 50 MB upload limit.');
        const key = drivePath(folder, cleanName(file.name));
        if (new TextEncoder().encode(key).length > 600) throw new Error('The file path is too long.');
        const { error } = await storage.upload(key, file, {
          upsert: false, contentType: file.type || 'application/octet-stream',
        });
        if (error) throw error;
        uploaded++;
      } catch (error) { failures.push(file.name + ': ' + error.message); }
    }
    driveStatus('Uploaded ' + uploaded + ' of ' + files.length + '.' + (failures.length ? ' ' + failures.join(' ') : ''));
  } finally {
    state.busy = false;
    if (state === drive) await listDrive(false, true);
  }
});
byId('drive-folder').addEventListener('click', async () => {
  const name = prompt('New folder name');
  if (name === null || drive.busy || drive.rank < 2) return;
  try {
    await goFolder(drivePath(drive.prefix, cleanName(name)));
    if (!drive.rows.length) driveStatus('Upload a file here to save this folder.');
  } catch (error) { driveStatus(error.message); }
});
byId('drive-trash').addEventListener('click', () => void goFolder('.trash'));
byId('drive-refresh').addEventListener('click', () => void openDrive());
byId('drive-more').addEventListener('click', () => void listDrive(true));

</script>
</body>
</html>
