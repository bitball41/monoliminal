:root{color-scheme:dark;--bg:#09003d;--deep:#070031;--panel:#20194e;--panel2:#2d255b;--surface:rgba(244,242,255,.045);--surface2:rgba(244,242,255,.08);--text:#f4f2ff;--soft:#c6c2d7;--muted:#928cae;--line:rgba(244,242,255,.11);--line2:rgba(244,242,255,.2);--accent:#a78bfa;--strong:#bda6fb;--accentSoft:rgba(167,139,250,.15);--danger:#ff7d91;--good:#58d39b;--shadow:0 20px 56px rgba(0,0,0,.34);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;scrollbar-width:none}*::-webkit-scrollbar{display:none}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{background:var(--bg);color:var(--text);font-size:14px}button,input,select{font:inherit;color:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}button,a,input,select{ -webkit-tap-highlight-color:transparent}button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:3px}input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}button{border:0}a{color:var(--strong)}svg{width:20px;height:20px;display:block;flex:none}button svg{pointer-events:none}h1,h2,p{margin:0}.hidden,[hidden]{display:none!important}::selection{background:var(--accentSoft)}
.app{height:100%;display:grid;grid-template-rows:58px minmax(0,1fr)}.topbar{display:flex;align-items:center;gap:22px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--deep)}.brand{display:flex;align-items:center;gap:11px;width:208px;flex:none;font-size:16px;font-weight:750;letter-spacing:-.4px}.brandmark{display:grid;place-items:center;width:31px;height:31px;border:1px solid rgba(167,139,250,.32);border-radius:10px;background:var(--accentSoft);color:var(--strong)}.brandmark svg{width:19px}.searchWrap{max-width:600px;flex:1;position:relative}.searchWrap>svg{position:absolute;left:13px;top:10px;width:17px;color:var(--muted)}.search{width:100%;height:38px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 65px 0 40px;outline:0;font-size:13px}.search::placeholder{color:var(--muted)}.search:focus{border-color:var(--accent);background:var(--surface2)}.searchKey{position:absolute;right:12px;top:9px;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--muted);font-size:11px;pointer-events:none}.clearSearch{position:absolute;right:7px;top:5px}.topActions{margin-left:auto;display:flex;align-items:center;gap:7px}.connection{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-right:9px}.connection:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--good)}.connection.error:before{background:var(--danger)}.iconBtn{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;background:transparent;color:var(--soft)}.iconBtn:hover{background:var(--surface2);color:var(--text)}.iconBtn.active{background:var(--accentSoft);color:var(--strong)}.avatar{width:32px;height:32px;min-width:32px;max-width:32px;min-height:32px;max-height:32px;overflow:hidden;flex-shrink:0;border-radius:50%;border:1px solid var(--line2);background:var(--panel2);font-size:11px;font-weight:800;color:var(--strong)}
.avatar>img{display:block;width:100%;height:100%;object-fit:cover}

@media(max-width:760px){.main{grid-template-columns:1fr}.sidebar.open{top:54px;width:268px}.brand{width:auto;font-size:19px}.brand>span{display:block}.topbar{gap:9px;padding:0 10px}.searchWrap{max-width:none}.topActions{gap:4px}.networkLink{display:none}.heading{padding:24px 16px 18px}.toolbar{padding-left:16px;padding-right:16px}.workspace{padding:16px 16px 70px}.libraryIntro{padding:18px}.libraryIntro h2{font-size:16px}.libraryIntro>svg{display:none}.libraryGrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.libraryArt{height:110px}.libraryCard .cardBody{padding:12px}.libraryCard .fileName{white-space:normal;line-height:1.5}.libraryCard .fileSub{min-height:52px;font-size:10px}.libraryFooter{padding:0 12px 12px;gap:5px}.libraryFooter .primary{font-size:11px}.previewHead .brand{display:none}.accountLink{font-size:10px;padding:8px}.searchKey{display:none}.previewTitle{min-width:35px}}
@media(max-width:420px){.brand{font-size:17px}.brand span span{display:none}.topbar{gap:6px}.search{font-size:11px;padding-left:33px}.libraryFooter .iconBtn{width:29px}.libraryGrid{gap:8px}}

<body>
<div class="app">
<header class="topbar">
<button class="iconBtn mobileMenu" id="sidebarToggle" aria-label="Toggle navigation"></button>
<div class="brand" aria-label="Liminal Drive"><span>Liminal <span style="color:var(--strong)">Drive</span></span></div>
<div class="searchWrap"><span id="searchIcon"></span><input class="search" id="searchInput" placeholder="Search files and folders" aria-label="Search files and folders" autocomplete="off"><span class="searchKey" id="searchKey">/</span><button class="iconBtn clearSearch hidden" id="clearSearch" aria-label="Clear search"></button></div>
<div class="topActions"><div class="connection" id="connectionLabel" role="status">Connecting</div><button class="iconBtn" id="refreshBtn" title="Refresh files" aria-label="Refresh files"></button><button class="iconBtn" id="themeBtn" title="Appearance" aria-label="Appearance"></button><button class="accountLink" id="accountBtn" title="Sign in to Liminal" aria-label="Sign in to Liminal">Sign in</button></div>
</header>
<div class="main">
<aside class="sidebar" id="sidebar"><button class="primary newBtn" id="newBtn"></button><div class="navLabel">Liminal Network</div><nav class="nav" id="sideNav"></nav><div class="sidebarBottom"><div class="storageLine"><span>Storage used</span><span id="storageText">—</span></div><div class="storageBar"><div class="storageFill" id="storageFill"></div></div><div class="storageNote">Public files. No sign-in needed.<br>Upload with a Mod role or above.</div><button class="accountCard" id="sidebarAccount" style="background:transparent;width:100%;text-align:left"><span class="avatar" id="sideAvatar" style="display:grid;place-items:center;flex:none">LD</span><span class="accountText"><span class="accountName" id="accountName">Guest</span><span class="accountRole" id="accountRole" style="display:block">Browse and download files</span></span></button></div></aside>
<main class="content"><div class="heading"><div class="headingText"><div class="breadcrumb" id="breadcrumb"></div><h1 id="viewTitle">Games</h1><p class="subtitle" id="subtitle">Files and folders.</p></div><button class="primary" id="uploadBtn"></button></div><div class="toolbar"><div class="filters" id="filters"></div><div class="toolbarRight"><select class="sortSelect" id="sortSelect" aria-label="Sort files"><option value="name">Name · A–Z</option><option value="modified">Newest first</option><option value="size">Largest first</option></select><div class="viewToggle"><button class="iconBtn" id="gridBtn" title="Grid view" aria-label="Grid view"></button><button class="iconBtn" id="listBtn" title="List view" aria-label="List view"></button></div></div></div><div class="workspace" id="workspace"><div class="sectionHead"><span class="sectionTitle" id="sectionTitle">Files</span><span class="resultMeta" id="resultMeta"></span></div><div id="fileArea"></div></div></main>
</div></div>
<div class="dropHint hidden" id="dropHint"><div class="dropCard"><span id="dropIcon"></span><strong>Drop files here</strong><span id="dropText">Upload into All files</span></div></div>
<div class="toastHost" id="toastHost" role="status" aria-live="polite"></div>
<section class="uploadPanel hidden" id="uploadPanel" aria-label="Uploads"><div class="uploadHead"><strong id="uploadTitle">Uploads</strong><button class="iconBtn" id="uploadClose" aria-label="Close uploads"></button></div><div class="uploadRows" id="uploadRows"></div><div class="uploadFoot"><span id="uploadSummary"></span><button class="secondary" id="uploadCancel" style="min-height:28px">Cancel remaining</button></div></section>

if(t==='html'&&p.mode==='run'){st.classList.add('runStage');const frame=document.createElement('iframe');frame.title='Run '+f.name;frame.setAttribute('sandbox','allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox allow-downloads allow-pointer-lock');frame.referrerPolicy='no-referrer';const base=f.publicUrl?new URL('.',f.publicUrl).href:'';const baseTag=base?`<base href="${esc(base)}">`:'';frame.srcdoc=/<head\b[^>]*>/i.test(text)?text.replace(/<head\b[^>]*>/i,m=>m+baseTag):baseTag+text;st.replaceChildren(frame)}

else{st.classList.add('sourceStage');st.innerHTML='<div class="sourcePaper"><pre></pre></div>';st.querySelector('pre').textContent=text+(p.complete?'':'\n\n… Preview limited to the first 1 MB. Download to read the complete file.')}}
else st.innerHTML=empty('No preview available',`${f.name} · ${size(f.size)}. Download this file to open it.`,icon(f),'Download','previewDownload');
if(state.preview===p&&p.version===version)previewNeighbors();}catch(e){if(e.name==='AbortError'||state.preview!==p||p.version!==version)return;previewError(e.message)}}
function previewError(message){$('#previewStage').className='previewStage';$('#previewStage').innerHTML=empty('Couldn’t preview this file',message,I.file,'Download','previewDownload');previewNeighbors()}
function pick(folder){if(!state.canUpload){toast('Sign in with a Liminal Mod role or above to upload.');return}if(state.uploadActive){toast('Wait for the current upload to finish.');return}const p=$(folder?'#folderPicker':'#filePicker');p.value='';p.click()}
function renderUploads(){const done=state.uploads.filter(x=>x.status==='done').length,failed=state.uploads.filter(x=>x.status==='error').length;$('#uploadPanel').classList.remove('hidden');$('#uploadTitle').textContent=state.uploadActive?'Uploading files':'Upload finished';$('#uploadClose').disabled=state.uploadActive;$('#uploadCancel').classList.toggle('hidden',!state.uploadActive);$('#uploadSummary').textContent=`${done} uploaded${failed?' · '+failed+' failed':''}${state.uploads.some(x=>x.status==='cancelled')?' · Cancelled':''}`;$('#uploadRows').innerHTML=state.uploads.map((u,i)=>`<div class="uploadRow"><div class="uploadName"><span title="${esc(u.key)}">${esc(u.file.name)}</span><span class="uploadStatus">${({queued:'Queued',uploading:Math.floor(u.progress)+'%',done:'Done',error:'Failed',cancelled:'Cancelled',skipped:'Skipped'})[u.status]}</span></div><div class="uploadProgress"><div style="width:${u.status==='done'?100:u.progress}%"></div></div>${u.error?`<div class="uploadError">${esc(u.error)}</div>`:''}${u.status==='error'||u.status==='cancelled'?`<button class="crumb" data-retry="${i}" ${state.uploadActive?'disabled':''}>Retry upload</button>`:''}</div>`).join('')}
function put(url,body,headers,onProgress){return new Promise((resolve,reject)=>{if(state.uploadCancel){reject(new DOMException('Cancelled','AbortError'));return}const x=new XMLHttpRequest();state.xhr=x;x.open('PUT',url);x.timeout=180000;Object.entries(headers||{}).forEach(([k,v])=>x.setRequestHeader(k,v));x.upload.onprogress=e=>{if(e.lengthComputable)onProgress(e.loaded/e.total)};const done=()=>{if(state.xhr===x)state.xhr=null};x.onload=()=>{done();let d;try{d=JSON.parse(x.responseText)}catch{d={}}if(x.status>=200&&x.status<300)resolve(d);else{const e=new Error(d.error||d.message||`Upload failed (${x.status})`);e.status=x.status;reject(e)}};x.onerror=()=>{done();reject(new Error('Upload connection failed.'))};x.ontimeout=()=>{done();reject(new Error('Upload timed out. Please retry.'))};x.onabort=()=>{done();reject(new DOMException('Cancelled','AbortError'))};x.send(body)})}
async function proxyPut(u,body,query,progress){if(!await ensureSession())throw new Error('Sign in cancelled');const url=new URL(ADMIN_API_URL);url.searchParams.set('key',u.key);Object.entries(query).forEach(([k,v])=>url.searchParams.set(k,String(v)));for(let i=0;i<2;i++){try{return await put(url.href,body,{apikey:PUBLISHABLE_KEY,Authorization:'Bearer '+state.auth.access_token,'Content-Type':u.contentType},progress)}catch(e){if(e.status!==401||i||!await refreshSession())throw e}}}
function updateProgress(u,n){u.progress=Math.max(0,Math.min(99,n));renderUploads()}
async function multipart(u,overwrite){let uploadId;try{const d=await requestAdmin({action:'multipart_create',key:u.key,content_type:u.contentType,overwrite});uploadId=d.uploadId;const partSize=d.partSize||8*1024**2;const parts=[];for(let start=0,num=1;start<u.file.size;start+=partSize,num++){if(state.uploadCancel)throw new DOMException('Cancelled','AbortError');const blob=u.file.slice(start,start+partSize);let part;for(let attempt=0;attempt<3;attempt++){try{part=await proxyPut(u,blob,{upload_id:uploadId,part_number:num},p=>updateProgress(u,(start+p*blob.size)/u.file.size*100));break}catch(e){if(e.name==='AbortError'||e.status&&e.status<500||attempt===2)throw e}}if(!part.etag)throw new Error('Upload part could not be verified.');parts.push({partNumber:num,etag:part.etag});updateProgress(u,(start+blob.size)/u.file.size*100)}if(state.uploadCancel)throw new DOMException('Cancelled','AbortError');await requestAdmin({action:'multipart_complete',key:u.key,upload_id:uploadId,parts})}catch(e){if(uploadId)await requestAdmin({action:'multipart_abort',key:u.key,upload_id:uploadId}).catch(()=>{});throw e}}
async function uploadOne(u){let overwrite=false,grant;try{grant=await requestAdmin({action:'presign_upload',key:u.key,content_type:u.contentType})}catch(e){if(e.status!==409||!e.data?.exists)throw e;if(!state.canManage)throw new Error('A file with this name already exists. Rename your file before uploading.');const replace=await ask({title:'Replace existing file?',text:`${u.key} already exists. Replacing it will overwrite the current contents.`,button:'Replace file',input:false,danger:true});if(!replace){u.status=state.uploadCancel?'cancelled':'skipped';return}overwrite=true;grant=await requestAdmin({action:'presign_upload',key:u.key,content_type:u.contentType,overwrite:true})}
if(state.uploadCancel)throw new DOMException('Cancelled','AbortError');if(grant.direct!==false){try{await put(grant.uploadUrl,u.file,grant.headers||{'Content-Type':u.contentType},p=>updateProgress(u,p*100));u.status='done';u.progress=100;return}catch(e){if(e.name==='AbortError')throw e;updateProgress(u,0)}}
if(u.file.size>(grant.maxProxyBytes||32*1024**2))await multipart(u,overwrite);else await proxyPut(u,u.file,{overwrite:overwrite?'1':'0'},p=>updateProgress(u,p*100));u.status='done';u.progress=100;}
async function uploadFiles(files,prefix){if(state.uploadActive){toast('Wait for the current upload to finish.');return}if(!files.length)return;const queue=files.map(file=>({file,key:prefix+(file.webkitRelativePath||file.name).replace(/^\/+/,''),contentType:file.type||mime(file.name),status:'queued',progress:0,error:''}));await runUploads(queue)}
async function runUploads(queue){if(state.uploadActive)return;state.uploadActive=true;state.uploadCancel=false;try{if(!await ensureUpload()){state.uploadActive=false;return}}catch(e){state.uploadActive=false;toast(e.message);return}state.uploads=queue;renderUploads();for(const u of queue){if(state.uploadCancel){u.status='cancelled';continue}u.status='uploading';u.error='';renderUploads();try{if(!u.key||/[\\\x00-\x1f\x7f]/.test(u.key)||u.key.split('/').some(x=>x==='.'||x==='..'||x.startsWith('.liminal-')))throw new Error('Invalid or reserved file path. Rename this file and retry.');await uploadOne(u)}catch(e){u.status=e.name==='AbortError'||state.uploadCancel?'cancelled':'error';u.error=u.status==='error'?e.message:'';if(e.status===401||e.status===403){state.uploadCancel=true}}renderUploads()}state.uploadActive=false;renderUploads();await refresh({quiet:true});const done=queue.filter(x=>x.status==='done').length;toast(`${done} file${done===1?'':'s'} uploaded${queue.some(x=>x.status==='error')?'. Check the upload panel for errors.':'.'}`)}
async function dropEntries(items){const out=[];const walk=async(entry,path='')=>{if(entry.isFile){const file=await new Promise((ok,no)=>entry.file(ok,no));out.push({file,path:path+file.name})}else if(entry.isDirectory){const reader=entry.createReader();let batch;do{batch=await new Promise((ok,no)=>reader.readEntries(ok,no));for(const child of batch)await walk(child,path+entry.name+'/')}while(batch.length)}};for(const item of items){const entry=item.webkitGetAsEntry?.();if(entry)await walk(entry);else{const f=item.getAsFile();if(f)out.push({file:f,path:f.name})}}return out}

let dragDepth=0;window.addEventListener('dragenter',e=>{if(Array.from(e.dataTransfer?.types||[]).includes('Files')){dragDepth++;$('#dropHint').classList.remove('hidden');$('#dropText').textContent=state.canUpload?'Add to '+(uploadPrefix()||'Drive'):'Sign in with a Mod role or above to upload'}});window.addEventListener('dragleave',()=>{dragDepth=Math.max(0,dragDepth-1);if(!dragDepth)$('#dropHint').classList.add('hidden')});window.addEventListener('dragover',e=>{e.preventDefault();if(e.dataTransfer)e.dataTransfer.dropEffect='copy'});window.addEventListener('drop',async e=>{e.preventDefault();dragDepth=0;$('#dropHint').classList.add('hidden');if(state.uploadActive){toast('Wait for the current upload to finish.');return}const prefix=uploadPrefix();const items=Array.from(e.dataTransfer?.items||[]);const fallback=Array.from(e.dataTransfer?.files||[]);try{const entries=items.length?await dropEntries(items):fallback.map(file=>({file,path:file.name}));if(entries.length)await runUploads(entries.map(({file,path})=>({file,key:prefix+path,contentType:file.type||mime(file.name),status:'queued',progress:0,error:''})))}catch(err){toast('Could not read the dropped files. '+err.message)}});
