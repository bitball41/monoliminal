async function previewText(p,full=false){if(p.f.size===0){p.text='';p.complete=true;return ''}if(p.text!==null&&(!full||p.complete))return p.text;const r=await net(fileUrl(p.f),{headers:full?{}:{Range:'bytes=0-1048575'},signal:p.controller.signal,cache:'no-store'},60000);if(!r.ok)throw new Error('Preview could not be loaded ('+r.status+').');if(full&&Number(r.headers.get('content-length'))>40*1024**2)throw new Error('This HTML file is too large to run in preview. Open it in a new tab.');const text=await r.text();if(state.preview!==p)throw new DOMException('Cancelled','AbortError');const range=r.headers.get('content-range');p.complete=!range||Number(range.split('/')[1])<=1048576;p.text=text;return text}
function parseDelimited(text,delimiter){const rows=[];let row=[],cell='',quote=false;for(let i=0;i<text.length&&rows.length<301;i++){const c=text[i];if(c==='"'){if(quote&&text[i+1]==='"'){cell+='"';i++}else quote=!quote}else if(c===delimiter&&!quote){if(row.length<30)row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quote){if(c==='\r'&&text[i+1]==='\n')i++;if(row.length<30)row.push(cell);rows.push(row);row=[];cell=''}else if(cell.length<20000)cell+=c}if((cell||row.length)&&rows.length<301){if(row.length<30)row.push(cell);rows.push(row)}return rows}

async function uploadFiles(files,prefix){if(state.uploadActive){toast('Wait for the current upload to finish.');return}if(!files.length)return;const queue=files.map(file=>({file,key:prefix+(file.webkitRelativePath||file.name).replace(/^\/+/,''),contentType:file.type||mime(file.name),status:'queued',progress:0,error:''}));await runUploads(queue)}
async function runUploads(queue){if(state.uploadActive)return;state.uploadActive=true;state.uploadCancel=false;try{if(!await ensureManage()){state.uploadActive=false;return}}catch(e){state.uploadActive=false;toast(e.message);return}state.uploads=queue;renderUploads();for(const u of queue){if(state.uploadCancel){u.status='cancelled';continue}u.status='uploading';u.error='';renderUploads();try{if(!u.key||/[\\\x00-\x1f\x7f]/.test(u.key)||u.key.split('/').some(x=>x==='.'||x==='..'||x.startsWith('.liminal-')))throw new Error('Invalid or reserved file path. Rename this file and retry.');await uploadOne(u)}catch(e){u.status=e.name==='AbortError'||state.uploadCancel?'cancelled':'error';u.error=u.status==='error'?e.message:'';if(e.status===401||e.status===403){state.uploadCancel=true}}renderUploads()}state.uploadActive=false;renderUploads();await refresh({quiet:true});const done=queue.filter(x=>x.status==='done').length;toast(`${done} file${done===1?'':'s'} uploaded${queue.some(x=>x.status==='error')?'. Check the upload panel for errors.':'.'}`)}
async function dropEntries(items){const out=[];const walk=async(entry,path='')=>{if(entry.isFile){const file=await new Promise((ok,no)=>entry.file(ok,no));out.push({file,path:path+file.name})}else if(entry.isDirectory){const reader=entry.createReader();let batch;do{batch=await new Promise((ok,no)=>reader.readEntries(ok,no));for(const child of batch)await walk(child,path+entry.name+'/')}while(batch.length)}};for(const item of items){const entry=item.webkitGetAsEntry?.();if(entry)await walk(entry);else{const f=item.getAsFile();if(f)out.push({file:f,path:f.name})}}return out}
// Populate the interface from local SVG icons; no CDN or runtime dependency.
$('#brandIcon').innerHTML=I.folder;$('#sidebarToggle').innerHTML=I.menu;$('#searchIcon').innerHTML=I.search;$('#searchIcon').style.cssText='position:absolute;left:13px;top:10px;color:var(--muted);pointer-events:none';$('#searchIcon svg').style.cssText='width:17px;height:17px';$('#clearSearch').innerHTML=I.close;$('#refreshBtn').innerHTML=I.refresh;$('#gridBtn').innerHTML=I.grid;$('#listBtn').innerHTML=I.list;$('#dropIcon').innerHTML=I.upload;$('#uploadClose').innerHTML=I.close;$('#newBtn').innerHTML=I.plus+'<span>New</span>';$('#uploadBtn').innerHTML=I.upload+'<span>Upload files</span>';
$('#sideNav').innerHTML=[['drive','All files',I.folder],['recent','Recent',I.clock],['starred','Starred',I.star],['trash','Trash',I.trash]].map(([v,n,i])=>`<button class="navBtn" data-view="${v}">${i}<span>${n}</span>${v==='trash'?'<span class="count" id="navTrashCount"></span>':v==='starred'?'<span class="count" id="navStarCount"></span>':''}</button>`).join('');
$('#filters').innerHTML=[['all','All'],['folder','Folders'],['html','HTML'],['image','Images'],['text','Documents'],['media','Media']].map(([k,n])=>`<button class="filter" data-filter="${k}">${n}</button>`).join('');
$('#searchInput').oninput=e=>{state.search=e.target.value;state.selected=null;render()};$('#clearSearch').onclick=()=>{state.search='';$('#searchInput').value='';render();$('#searchInput').focus()};$('#sortSelect').onchange=e=>{state.sort=e.target.value;try{localStorage.setItem('ld-sort',state.sort)}catch{}render()};$('#gridBtn').onclick=()=>layout('grid');$('#listBtn').onclick=()=>layout('list');function layout(l){state.layout=l;try{localStorage.setItem('ld-layout',l)}catch{}render()}
$('#refreshBtn').onclick=()=>refresh();$('#newBtn').onclick=e=>newMenu(e.currentTarget);$('#uploadBtn').onclick=()=>pick(false);$('#accountBtn').onclick=account;$('#sidebarAccount').onclick=account;$('#sidebarToggle').onclick=()=>$('#sidebar').classList.toggle('open');$$('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));$$('[data-filter]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;render()});
// Snapshot FileList BEFORE clearing the picker: FileList is live in Chromium.
for(const id of ['#filePicker','#folderPicker'])$(id).onchange=e=>{const files=Array.from(e.target.files||[]);const prefix=state.view==='drive'?state.prefix:'';e.target.value='';uploadFiles(files,prefix)};
$('#fileArea').onclick=e=>{const action=e.target.closest('[data-action]');if(action){if(action.dataset.action==='retry')refresh();else if(action.dataset.action==='upload')pick(false);return}const b=e.target.closest('[data-menu]');if(b){const f=state.itemMap.get(b.dataset.menu),r=b.getBoundingClientRect();select(f.id);fileMenu(f,r.left,r.bottom+4);return}const el=e.target.closest('[data-id]');if(!el)return;select(el.dataset.id);if(e.detail===2)openItem(state.itemMap.get(el.dataset.id))};
$('#fileArea').oncontextmenu=e=>{const el=e.target.closest('[data-id]');if(!el)return;e.preventDefault();select(el.dataset.id);fileMenu(state.itemMap.get(el.dataset.id),e.clientX,e.clientY)};
$('#fileArea').onkeydown=e=>{if(e.target.closest('[data-menu]'))return;const el=e.target.closest('[data-id]');if(!el)return;if(e.key==='Enter'){e.preventDefault();openItem(state.itemMap.get(el.dataset.id))}else if(e.key===' '){e.preventDefault();select(el.dataset.id)}};
$('#uploadClose').onclick=()=>$('#uploadPanel').classList.add('hidden');$('#uploadCancel').onclick=()=>{state.uploadCancel=true;state.xhr?.abort();if(state.modal)closeModal(false);toast('Cancelling remaining uploads…')};$('#uploadRows').onclick=e=>{const b=e.target.closest('[data-retry]');if(b&&!state.uploadActive){const u=state.uploads[Number(b.dataset.retry)];runUploads([{...u,status:'queued',progress:0,error:''}])}};
let dragDepth=0;window.addEventListener('dragenter',e=>{if(Array.from(e.dataTransfer?.types||[]).includes('Files')){dragDepth++;$('#dropHint').classList.remove('hidden');$('#dropText').textContent=state.view==='drive'&&state.prefix?'Upload into '+state.prefix:'Upload into All files'}});window.addEventListener('dragleave',()=>{dragDepth=Math.max(0,dragDepth-1);if(!dragDepth)$('#dropHint').classList.add('hidden')});window.addEventListener('dragover',e=>{e.preventDefault();if(e.dataTransfer)e.dataTransfer.dropEffect='copy'});window.addEventListener('drop',async e=>{e.preventDefault();dragDepth=0;$('#dropHint').classList.add('hidden');if(state.uploadActive){toast('Wait for the current upload to finish.');return}const prefix=state.view==='drive'?state.prefix:'';const items=Array.from(e.dataTransfer?.items||[]);const fallback=Array.from(e.dataTransfer?.files||[]);try{const entries=items.length?await dropEntries(items):fallback.map(file=>({file,path:file.name}));if(entries.length)await runUploads(entries.map(({file,path})=>({file,key:prefix+path,contentType:file.type||mime(file.name),status:'queued',progress:0,error:''})))}catch(err){toast('Could not read the dropped files. '+err.message)}});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.menu'))closeMenus();if(!e.target.closest('#sidebar,#sidebarToggle'))$('#sidebar').classList.remove('open')});
document.addEventListener('click',e=>{if(e.target.closest('[data-action="previewDownload"]')&&state.preview)download(state.preview.f)});
window.addEventListener('keydown',e=>{const typing=e.target.matches('input,textarea,select')||e.target.isContentEditable;if(e.key==='Escape'){if(state.modal)closeModal();else if($('.menu'))closeMenus();else if(state.preview)closePreview();else $('#sidebar').classList.remove('open');return}const dialog=state.modal?.el||state.preview?.el;if(e.key==='Tab'&&dialog){const fs=[...dialog.querySelectorAll('button:not(:disabled),input,select,a[href],iframe')].filter(x=>x.getClientRects().length);if(fs.length){const first=fs[0],last=fs[fs.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}}if(typing||state.modal)return;if(state.preview){if(e.key==='ArrowLeft')previewStep(-1);if(e.key==='ArrowRight')previewStep(1);return}if(e.key==='/'){e.preventDefault();$('#searchInput').focus()}if(e.key==='Enter'&&state.selected&&!e.target.closest('[data-id],button'))openItem(state.itemMap.get(state.selected));if(e.key==='Delete'&&state.selected){e.preventDefault();const f=state.itemMap.get(state.selected);if(f)dispatch(f.trashed?'permanent':'trash',f)}});
window.addEventListener('beforeunload',e=>{if(state.uploadActive){e.preventDefault();e.returnValue=''}});
render();refresh({quiet:true});
if(state.auth)(Number(state.auth.expires_at)>Date.now()+60000?Promise.resolve(true):refreshSession()).then(ok=>ok?requestAdmin({action:'status'}):null).then(s=>{if(s){state.canManage=!!s.canManage;updateAccount()}}).catch(()=>{});
})();
